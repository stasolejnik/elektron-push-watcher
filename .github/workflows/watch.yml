name: eLektron push watcher

on:
  schedule:
    # GitHub nie gwarantuje dokładności co do minuty przy dużym obciążeniu — w praktyce
    # zwykle +/- kilka minut. To i tak lepsze niż 15-minutowy polling appki.
    - cron: "*/5 * * * *"
  workflow_dispatch: {} # pozwala odpalić ręcznie z zakładki Actions, do testów

# Watcher commituje z powrotem zaktualizowany state.json — potrzebne uprawnienie do zapisu.
permissions:
  contents: write

concurrency:
  group: elektron-push-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Sprawdź zmiany i wyślij push
        env:
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
        run: python watch.py

      - name: Zacommituj zaktualizowany stan
        run: |
          git config user.name "elektron-push-watcher"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- state.json; then
            git add state.json
            git commit -m "chore: aktualizacja stanu watchera [skip ci]"
            git push
          else
            echo "Brak zmian w state.json"
          fi
